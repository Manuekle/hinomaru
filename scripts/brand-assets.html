<!doctype html>

<style>
*{box-sizing:border-box}body{margin:0;width:1200px;height:630px;background:#fff;color:#16151a;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;overflow:hidden;position:relative;letter-spacing:-.01em}
.glyph{position:absolute;right:-30px;top:50%;translate:0 -50%;font:700 620px/1 "Hiragino Sans",-apple-system,sans-serif;color:#f2f1f4}
.brand{position:absolute;left:80px;top:64px;display:flex;align-items:center;gap:14px}.brand .icon{width:56px;border-radius:13px}.brand .word{width:120px;height:auto}

p{position:absolute;left:80px;top:392px;width:560px;margin:0;font-size:24px;line-height:1.45;color:#55515b;text-wrap:balance}

.phone{position:absolute;right:150px;top:44px;height:600px;aspect-ratio:1390/2858;filter:drop-shadow(0 30px 40px rgba(22,21,26,.14))}
